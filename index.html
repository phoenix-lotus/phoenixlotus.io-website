<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ff5e3a" />

    <!--
      Apply the saved/preferred theme before first paint — avoids a white flash
      for dark-mode visitors while React (and useTheme) is still mounting.
      Keep this logic in sync with src/lib/useTheme.ts's getInitial().
    -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme')
          var dark = s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>

    <!--
      Everything below marked data-default is a pre-render fallback for
      clients that never run JS (link-preview bots, a bare curl) — every
      route also renders its own title/description/canonical/og:* via
      React 19's native head hoisting (see src/pages/*.tsx), so once the
      app mounts these are redundant and get removed by DefaultMetaCleanup
      in App.tsx. React's hoisting only manages tags it renders itself; it
      doesn't know to replace tags that were already static HTML, so
      leaving these in place after mount left og:title etc. stuck on
      the home page's copy even while viewing a case study.
    -->
    <title data-default>PhoenixLotus Web Studio — Websites for Mendocino County small businesses</title>
    <meta
      data-default
      name="description"
      content="PhoenixLotus Web Studio — a one-person web studio in Mendocino County, CA, building and maintaining websites for small local businesses."
    />
    <link data-default rel="canonical" href="https://phoenixlotus.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PhoenixLotus" />
    <meta
      data-default
      property="og:title"
      content="PhoenixLotus Web Studio — Websites for Mendocino County small businesses"
    />
    <meta
      data-default
      property="og:description"
      content="PhoenixLotus Web Studio — a one-person web studio in Mendocino County, CA, building and maintaining websites for small local businesses."
    />
    <meta data-default property="og:url" content="https://phoenixlotus.netlify.app/" />
    <meta property="og:image" content="https://phoenixlotus.netlify.app/og/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..900;1,9..144,600..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      One block, not two: this replaced a standalone Person block that
      described a developer rather than the business, so a search engine
      reading this page and a prospect reading a pitch saw two different
      companies. The person is still here, as `founder`.

      Deliberately NO `address`. This is a service-area business with no
      public storefront, so the geography is modeled as `areaServed` —
      inventing a PostalAddress to satisfy a rich-result checklist would be
      stating an unverified fact, which this house doesn't do.

      `offers` prices must match what /services actually renders. Both are
      hand-copied from phoenixlotus-pitch-kit's src/content/rateCard.ts;
      change that file first, then src/data/services.ts, then here.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://phoenixlotus.netlify.app/#studio",
        "name": "PhoenixLotus Web Studio",
        "alternateName": "PhoenixLotus",
        "description": "A one-person web studio in Mendocino County, California, building and maintaining websites for small local businesses.",
        "url": "https://phoenixlotus.netlify.app/",
        "email": "robert.goldberg.dev@gmail.com",
        "image": "https://phoenixlotus.netlify.app/og/og-default.png",
        "logo": "https://phoenixlotus.netlify.app/logo.png",
        "knowsLanguage": "en",
        "founder": {
          "@type": "Person",
          "name": "Robert Goldberg",
          "alternateName": "Bobby Goldberg",
          "jobTitle": "Web designer & developer",
          "sameAs": [
            "https://github.com/phoenix-lotus",
            "https://www.linkedin.com/in/robert-g-838955193"
          ]
        },
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Mendocino County, California"
        },
        "sameAs": [
          "https://github.com/phoenix-lotus",
          "https://www.linkedin.com/in/robert-g-838955193"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Website care and local visibility plans",
          "url": "https://phoenixlotus.netlify.app/services",
          "itemListElement": [
            {
              "@type": "Offer",
              "name": "Care & Hosting",
              "description": "Hosting, uptime monitoring, security and dependency updates, up to two content updates a month, and a monthly health report.",
              "priceCurrency": "USD",
              "price": "99",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "priceCurrency": "USD",
                "price": "99",
                "unitCode": "MON"
              }
            },
            {
              "@type": "Offer",
              "name": "Care + Local Visibility",
              "description": "Everything in Care & Hosting, plus Google Business Profile management, local citations, and one to two SEO-tuned pages or posts a month.",
              "priceCurrency": "USD",
              "price": "179",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "priceCurrency": "USD",
                "price": "179",
                "unitCode": "MON"
              }
            },
            {
              "@type": "Offer",
              "name": "Care + Visibility + Social",
              "description": "Everything above, plus three posts a week across two platforms, a content calendar, and a monthly engagement summary.",
              "priceCurrency": "USD",
              "price": "249",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "priceCurrency": "USD",
                "price": "249",
                "unitCode": "MON"
              }
            },
            {
              "@type": "Offer",
              "name": "Google Business Profile setup",
              "description": "One-time setup of a complete, correct Google Business Profile: fields, categories, service areas, hours, photos, services, and Q&A.",
              "priceCurrency": "USD",
              "price": "450"
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hidden static form so Netlify's build-time bot detects it (the real form is React-rendered). -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
